<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#081522">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="description" content="وب‌سایت هینا الکتریک به‌زودی افتتاح می‌شود. برای اطلاعات بیشتر با ما تماس بگیرید.">
  <title>هینا الکتریک | به‌زودی</title>
  <style>
    :root {color-scheme: dark; --navy:#081522; --gold:#e9bd73; --text:#f3f5f7; --muted:#9cadbc}
    *,*::before,*::after{box-sizing:border-box}
    html{min-height:100%;background:var(--navy)}
    body{margin:0;min-height:100vh;min-height:100svh;font-family:Tahoma,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(ellipse 75% 55% at 50% 42%,#172e44 0%,#0b1d30 51%,#071320 100%);display:grid;place-items:center;text-align:center}
    main{width:min(100% - 36px,520px);margin:48px auto;padding:42px 24px 46px;border:1px solid #d7ab6133;border-radius:28px;background:linear-gradient(155deg,#162b3cdd,#0a1828e8);box-shadow:0 25px 80px #02070da8, inset 0 1px #ffffff0a;display:flex;align-items:center;flex-direction:column}
    .logo{width:116px;height:116px;object-fit:contain;border-radius:24px;background:#ffffff;box-shadow:0 10px 35px #0005;border:3px solid #dcb576}
    .brand{font-size:clamp(1.6rem,5vw,2rem);font-weight:800;letter-spacing:-.5px;margin:24px 0 8px}
    .en{font:700 .77rem/1.5 "Segoe UI",sans-serif;letter-spacing:3px;color:var(--gold);direction:ltr;margin:0 0 28px}
    .loader{width:48px;height:48px;border:3px solid #e9bd7325;border-top-color:var(--gold);border-right-color:#e9bd73aa;border-radius:50%;animation:spin 1.15s linear infinite;margin-bottom:24px}
    h1{font-size:clamp(1.1rem,3.8vw,1.5rem);line-height:2;margin:0;font-weight:700}
    .divider{height:1px;width:92px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:25px 0}
    .contact-label{color:var(--muted);font-size:.92rem;margin:0 0 12px}
    .phone{display:inline-flex;align-items:center;justify-content:center;min-height:48px;direction:ltr;color:var(--gold);border:1px solid #e9bd7355;background:#e9bd730d;padding:10px 23px;border-radius:50px;font:700 1.2rem/1.6 Tahoma,"Segoe UI",sans-serif;letter-spacing:1px;text-decoration:none;transition:background .2s,border-color .2s}
    .phone:hover,.phone:focus-visible{background:#e9bd7322;border-color:var(--gold)}
    .phone:focus-visible{outline:2px solid white;outline-offset:3px}
    @keyframes spin {to{transform:rotate(360deg)}}
    @media(max-width:480px){main{padding:38px 16px 42px;border-radius:22px}.logo{width:103px;height:103px}}
    @media(prefers-reduced-motion:reduce){.loader{animation:none;border-color:var(--gold);border-left-color:transparent}}
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/assets/logo.jpg" alt="لوگوی هینا الکتریک" width="116" height="116">
    <div class="brand">هینا الکتریک</div>
    <p class="en" lang="en">HEENA ELECTRIC</p>
    <div class="loader" role="status" aria-label="در حال آماده‌سازی سایت"></div>
    <h1>به‌زودی سایت افتتاح می‌شود</h1>
    <div class="divider" aria-hidden="true"></div>
    <p class="contact-label">برای اطلاعات بیشتر تماس بگیرید</p>
    <a class="phone" href="tel:+989375433417" aria-label="تماس با هینا الکتریک به شماره ۰۹۳۷۵۴۳۳۴۱۷"><bdi>۰۹۳۷۵۴۳۳۴۱۷</bdi></a>
  </main>
</body>
</html>
